[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-bridge"
version = "0.1.0"
description = "Bot Status macOS bridge - contract models, validation entry (T03)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
